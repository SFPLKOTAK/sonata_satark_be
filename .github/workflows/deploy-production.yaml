name: Deploy Satark Backend Production to IIS

on:
  push:
    branches:
      - satark_production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Code & Apply Migrations
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:GIT_TERMINAL_PROMPT = "0"

          # Ensure Git and Python virtual environment are found in runner environment
          if ($env:Path -notmatch [regex]::Escape("C:\ProgramData\Git\cmd")) {
            $env:Path = "C:\ProgramData\Git\cmd;" + $env:Path
          }
          if ($env:Path -notmatch [regex]::Escape("C:\inetpub\wwwroot\sonata_satark_be\env\Scripts")) {
            $env:Path = "C:\inetpub\wwwroot\sonata_satark_be\env\Scripts;" + $env:Path
          }

          # 1. Safe directory config
          git config --global --add safe.directory C:/inetpub/wwwroot/sonata_satark_be

          cd C:\inetpub\wwwroot\sonata_satark_be

          # 2. Fetch all remote branches first
          git -c "url.https://x-access-token:${env:GH_TOKEN}@github.com/.insteadOf=https://github.com/" fetch origin

          # 3. Stash any local/untracked changes before checkout/pull
          $stashOutput = git stash push -u -m "pre-deploy-autostash"
          $didStash = -not ($stashOutput -match "No local changes to save")
          Write-Host "Stash output: $stashOutput"

          # 4. Ensure satark_production branch is checked out safely
          git checkout satark_production 2>$null
          if ($LASTEXITCODE -ne 0) {
              git checkout -b satark_production origin/satark_production
          }

          # 5. Store requirements.txt hash BEFORE pulling
          $reqPath = "C:\inetpub\wwwroot\sonata_satark_be\requirements.txt"
          $oldHash = ""
          if (Test-Path $reqPath) {
            $oldHash = (Get-FileHash $reqPath).Hash
          }

          # 6. Pull latest changes using in-memory token override (never touches .git/config)
          git -c "url.https://x-access-token:${env:GH_TOKEN}@github.com/.insteadOf=https://github.com/" pull origin satark_production
          if ($LASTEXITCODE -ne 0) {
              Write-Error "git pull failed. Attempting to restore stash before exiting."
              if ($didStash) {
                  git stash pop
              }
              exit 1
          }

          # 7. Restore stash if changes were saved
          if ($didStash) {
              Write-Host "Restoring stashed changes..."
              git stash pop
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "git stash pop produced a conflict or notice. Stash is kept for safety."
              }
          }

          # 8. Store requirements.txt hash AFTER pulling
          $newHash = ""
          if (Test-Path $reqPath) {
            $newHash = (Get-FileHash $reqPath).Hash
          }

          # 9. Install Python dependencies only if requirements.txt changed
          if ($oldHash -ne $newHash) {
            Write-Host "Dependencies changed. Running pip install..."
            C:\inetpub\wwwroot\sonata_satark_be\env\Scripts\python.exe -m pip install -r $reqPath
            if ($LASTEXITCODE -ne 0) {
                Write-Error "pip install failed"
                exit 1
            }
          } else {
            Write-Host "No dependency changes detected. Skipping pip install."
          }

          # 10. Apply Django database migrations
          cd C:\inetpub\wwwroot\sonata_satark_be\satark
          Write-Host "Running Django migrations..."
          C:\inetpub\wwwroot\sonata_satark_be\env\Scripts\python.exe manage.py migrate --noinput
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Django migrations failed"
              exit 1
          }

          # 11. Recycle IIS AppPool and restart site for live update
          Import-Module WebAdministration
          Restart-WebAppPool -Name "satark_fe" -ErrorAction SilentlyContinue
          Restart-WebItem "IIS:\Sites\satark_fe" -ErrorAction SilentlyContinue

          Write-Host "Satark Backend production deployment completed successfully."
