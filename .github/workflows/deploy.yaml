name: Deploy Satark Backend Main to IIS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Code & Apply Migrations
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:GIT_TERMINAL_PROMPT = "0"

          # Ensure Git and Python virtual environment are found in runner environment
          if ($env:Path -notmatch [regex]::Escape("C:\ProgramData\Git\cmd")) {
            $env:Path = "C:\ProgramData\Git\cmd;" + $env:Path
          }
          if ($env:Path -notmatch [regex]::Escape("C:\inetpub\wwwroot\sonata_satark_be\env\Scripts")) {
            $env:Path = "C:\inetpub\wwwroot\sonata_satark_be\env\Scripts;" + $env:Path
          }

          # 1. Safe directory config
          git config --global --add safe.directory C:/inetpub/wwwroot/sonata_satark_be

          cd C:\inetpub\wwwroot\sonata_satark_be

          # 2. Clear any stuck index states or unmerged conflicts
          git reset --hard HEAD

          # 3. Fetch latest origin refs using in-memory token override
          git -c "url.https://x-access-token:${env:GH_TOKEN}@github.com/.insteadOf=https://github.com/" fetch origin main

          # 4. Force checkout and align main with origin/main
          git checkout -B main origin/main

          # 5. Store requirements.txt hash BEFORE pulling
          $reqPath = "C:\inetpub\wwwroot\sonata_satark_be\requirements.txt"
          $oldHash = ""
          if (Test-Path $reqPath) {
            $oldHash = (Get-FileHash $reqPath).Hash
          }

          # 6. Pull latest changes using in-memory token override
          git -c "url.https://x-access-token:${env:GH_TOKEN}@github.com/.insteadOf=https://github.com/" pull origin main
          if ($LASTEXITCODE -ne 0) {
              Write-Error "git pull failed"
              exit 1
          }

          # 7. Store requirements.txt hash AFTER pulling
          $newHash = ""
          if (Test-Path $reqPath) {
            $newHash = (Get-FileHash $reqPath).Hash
          }

          # 8. Install Python dependencies only if requirements.txt changed
          if ($oldHash -ne $newHash) {
            Write-Host "Dependencies changed. Running pip install..."
            C:\inetpub\wwwroot\sonata_satark_be\env\Scripts\python.exe -m pip install -r $reqPath
            if ($LASTEXITCODE -ne 0) {
                Write-Error "pip install failed"
                exit 1
            }
          } else {
            Write-Host "No dependency changes detected. Skipping pip install."
          }

          # 9. Apply Django database migrations
          cd C:\inetpub\wwwroot\sonata_satark_be\satark
          Write-Host "Running Django migrations..."
          C:\inetpub\wwwroot\sonata_satark_be\env\Scripts\python.exe manage.py migrate --noinput
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Django migrations failed"
              exit 1
          }

          # 10. Recycle IIS AppPool and restart site for live update
          Import-Module WebAdministration
          Restart-WebAppPool -Name "satark_fe" -ErrorAction SilentlyContinue
          Restart-WebItem "IIS:\Sites\satark_fe" -ErrorAction SilentlyContinue

          Write-Host "Satark Backend main deployment completed successfully."